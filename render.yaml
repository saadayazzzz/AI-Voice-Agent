# Render Blueprint — free tier, no credit card required.
#
# Deploy: push this repo to GitHub, then on render.com choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file,
# builds the Dockerfile, and prompts for the secrets marked `sync: false`.
#
# Note on the free plan: the service sleeps after ~15 minutes of inactivity
# and takes roughly a minute to wake on the next request. Fine for a demo —
# just open the URL once and wait for it before starting a voice session.

services:
  - type: web
    name: voice-ai-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Prompted in the Render dashboard, never stored in the repo.
      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime
      - key: OPENAI_VOICE
        value: marin

      - key: AGENT_SYSTEM_PROMPT
        value: >-
          You are a friendly, concise voice assistant for a business called
          Acme Co. Greet the caller, understand why they are calling, answer
          questions helpfully, and if they want to leave contact details use
          the save_lead tool. Keep responses short and conversational since
          this is a spoken conversation.
      - key: AGENT_GREETING
        value: Hi! Thanks for calling Acme Co. How can I help you today?

      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # SQLite on the free plan lives on an ephemeral disk: calls and
      # transcripts reset on every redeploy. Swap in a managed Postgres URL
      # here if the data needs to survive — no code changes required.
      - key: DATABASE_URL
        value: sqlite:///./voice_agent.db
